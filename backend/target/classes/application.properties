# Port is set dynamically by Render
server.port=${PORT:8081}

# Use Environment Variables for MongoDB and Security
spring.data.mongodb.uri=${MONGODB_URI}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Encryption and JWT Keys from environment
app.encryption.key=${ENCRYPTION_KEY:my-default-secret-key-32-chars-!!!}
app.jwt.secret=${JWT_SECRET:my-default-jwt-secret-at-least-256-bits!!!}
